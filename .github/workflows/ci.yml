name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Windows-only бібліотеки підмінені заглушками (tests/stubs.py), тому
    # тут ганяються і чиста логіка, і поведінка Рафаеля цілком (smoke-тести).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyflakes psutil SpeechRecognition spotipy pillow
      - run: python -m py_compile *.py
      - run: python -m pyflakes *.py tests/*.py
      - run: python -m pytest -q
